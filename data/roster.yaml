# The Roster — the only place OpenCode's vocabulary and Artificial Analysis's meet.
#
# One entry per model id served by https://opencode.ai/inference/go/v1/models.
# Every field here is a human decision. Nothing is inferred from a name.
#
#   goId       exact id from the Go models endpoint
#   display    how the model is written on the site
#   aaSlug     Artificial Analysis slug, or null when AA has no counterpart
#   aaVariant  which AA configuration the score describes (informational)
#   tier       standard | free | unpriced | incomplete
#   priceRow   exact row name in data/go-pricing.json, or null when unpriced
#
# Rules enforced at build time (scripts/validate-roster.ts):
#   - every id from the Go endpoint must appear here
#   - every priceRow must exist in data/go-pricing.json
#   - tier: unpriced must have priceRow: null
#   - tier: standard|free must have a priceRow
#
# When OpenCode adds or removes a model, the build fails. Update this file.
# Context-tiered and peak/off-peak models use the cheaper row — the price the
# majority of requests pay. The tooltip says which row was used.

# --- Priced models ---------------------------------------------------------

