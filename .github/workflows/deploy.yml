name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Data refresh runs only on the schedule or by hand. A push builds
      # whatever is committed, so a code change never silently re-prices.
      - name: Check Go pricing for drift
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run scrape:go

      - name: Fetch Artificial Analysis scores
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: npm run fetch:aa

      - name: Validate the roster
        run: npm run validate:roster

      - name: Build the dataset
        run: npm run data:build

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'Data unchanged.'
          else
            git commit -m 'chore: refresh pricing and scores'
            git push
          fi

      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
