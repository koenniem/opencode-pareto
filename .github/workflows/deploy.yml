---
name: Build and deploy

'on':
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Data refresh runs only on the schedule or by hand. A push builds
      # whatever is committed, so a code change never silently re-prices.
      # There is no human in a scheduled run, so the scrape accepts the drift
      # itself instead of failing the nightly build. The applied diff is the
      # audit trail: it is appended to the job summary below and the commit
      # step turns it into a reviewable diff. A scrape that loses an implausible
      # share of the table still fails here rather than overwriting good data.
      - name: Refresh Go pricing
        if: github.event_name != 'push'
        run: |
          set -o pipefail
          npm run scrape:go -- --write | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fetch Artificial Analysis scores
        if: github.event_name != 'push'
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: npm run fetch:aa

      # Keep the raw snapshot even when the roster fails validation: the slug
      # list in it is how the roster gets corrected.
      - name: Keep the AA snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aa-snapshot
          path: data/aa-full.json
          if-no-files-found: ignore

      # Warnings (a model left the table, a priced row is missing from the
      # roster) are not fatal, so surface them where a human will see them.
      - name: Validate the roster
        run: |
          set -o pipefail
          npm run validate:roster 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the dataset
        run: npm run data:build

      - run: npm test
      - run: npm run build

      # Committed only after the whole pipeline is green: a red build must not
      # leave unbuilt data behind, or every later run fails on it.
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'Data unchanged.'
          else
            git commit -m 'chore: refresh pricing and scores'
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
